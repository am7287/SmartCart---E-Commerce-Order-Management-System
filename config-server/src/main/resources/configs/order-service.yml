server:
  port: 8083

spring:
  datasource:
    url: jdbc:mysql://localhost:3306/smartcart_orders
    username: ${MYSQL_USERNAME:root}
    password: ${MYSQL_PASSWORD:root}
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true

product:
  service:
    url: http://product-service

resilience4j:
  circuitbreaker:
    instances:
      productService:
        sliding-window-size: 5
        failure-rate-threshold: 50
        wait-duration-in-open-state: 10s
  retry:
    instances:
      productService:
        max-attempts: 3
        wait-duration: 1s

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
